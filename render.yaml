# Render Blueprint: provisions the NestJS API and a managed Postgres instance.
databases:
  - name: securebypay-db
    plan: free
services:
  - type: web
    name: securebypay-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: securebypay-db, property: connectionString }
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGINS
        sync: false # set to the Vercel URL after the frontend deploys
